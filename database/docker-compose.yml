version: '3.8'

services:

  db:
    image: mysql:5.7
    container_name: wordpress_db
    restart: always

    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppassword
      MYSQL_ROOT_PASSWORD: rootpassword

    ports:
      - "3306:3306"

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - wordpress_network

volumes:
  db_data:

networks:
  wordpress_network:
    external: true
