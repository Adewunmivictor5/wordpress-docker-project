version: '3.8'

services:

  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: always

    ports:
      - "8080:80"

    environment:
      WORDPRESS_DB_HOST: wordpress_db:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppassword
      WORDPRESS_DB_NAME: wordpress

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - wordpress_network

volumes:
  wordpress_data:

networks:
  wordpress_network:
    external: true
